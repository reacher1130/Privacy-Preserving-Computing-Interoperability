# Native PaddleDTX/unicom-dtx console for the chain-paddle counterpart.
# The frontend keeps its original routes and visual system. The total platform
# stays on 18101 and only links here when the peer protocol is PaddleDTX.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # The demo keeps the native UI available even when the optional manager
    # service is not running. If a manager is deployed, override this config or
    # point it at the manager service without changing the frontend origin.
    location /dtx/v1/ {
        proxy_pass http://host.docker.internal:8084/dtx/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location ~* \.(?:html|js|css|map|png|jpg|jpeg|gif|svg|woff2?)$ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /static/unicom-dtx/page/index.html; }
}
