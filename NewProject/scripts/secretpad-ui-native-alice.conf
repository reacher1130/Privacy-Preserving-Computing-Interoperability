# Native SecretPad frontend for Alice's SecretFlow/Kuscia protocol.
# The total protocol hub remains on 18101; this origin deliberately serves the
# upstream SecretPad assets so native mode keeps the original SecretPad layout.
upstream secretpad_alice_native { server host.docker.internal:18080; }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    absolute_redirect off;
    location = / { return 302 /edge?ownerId=alice; }

    location ~ ^/(api|v1|sync)/ {
        proxy_pass http://secretpad_alice_native;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location ~* \.(?:html|js|css|map)$ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
