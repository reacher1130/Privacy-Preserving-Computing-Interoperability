# Single-origin local demo frontend for the Alice SecretPad.
# The multi-origin demo uses secretpad-ui-e2e.conf; this file keeps the
# historical 18100 entry point useful without relying on a temporary /tmp bind.
upstream secretpad_alice_single { server host.docker.internal:18080; }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    location ~ ^/(api|v1|sync)/ {
        proxy_pass http://secretpad_alice_single;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location ~* \.(?:html|js|css|map)$ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
