# Three independent browser origins, one frontend build. These ports are bound
# to localhost by the Docker startup command; no development auth on public ports.
upstream secretpad_alice { server host.docker.internal:18080; }
upstream secretpad_bob { server host.docker.internal:28090; }
upstream secretpad_kimi { server host.docker.internal:38090; }
map $server_port $secretpad_backend {
    80 secretpad_alice;
    81 secretpad_bob;
    82 secretpad_kimi;
}
map "$server_port:$request_method" $kimi_protocol_status {
    default 0;
    "82:GET" 200;
    "82:HEAD" 200;
    ~^82: 405;
}
server {
    listen 80;
    listen 81;
    listen 82;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    # The upstream Kimi backend has one native mode and no protocol-config API.
    location = /api/v1alpha1/config/protocol {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if ($kimi_protocol_status = 405) { return 405; }
        if ($kimi_protocol_status = 200) {
            return 200 '{"status":{"code":0,"msg":"success"},"data":{"defaultProtocol":"secretflow","activeProtocol":"secretflow","canSwitch":false,"supportedProtocols":["secretflow"],"engineByProtocol":{"secretflow":"SecretFlow / Kuscia"}}}';
        }
        proxy_pass http://$secretpad_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/(api|v1|sync)/ {
        proxy_pass http://$secretpad_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }
    # The demo build is replaced in-place while the local containers run. Do
    # not let a browser combine an old Umi runtime with new async chunks after
    # a rebuild; production deployments should use immutable, hashed assets.
    location ~* \.(?:html|js|css|map)$ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
