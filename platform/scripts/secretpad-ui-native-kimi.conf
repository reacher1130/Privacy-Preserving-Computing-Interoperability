# Upstream SecretPad frontend for the Kimi counterpart node.
# This origin deliberately serves the native SecretPad assets; the fixed total
# platform remains on 18101 and is never re-skinned by protocol selection.
upstream secretpad_kimi_native { server host.docker.internal:38090; }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    absolute_redirect off;
    location = / { return 302 /edge?ownerId=kimi; }

    location ~ ^/(api|v1|sync)/ {
        proxy_pass http://secretpad_kimi_native;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location ~* \.(?:html|js|css|map)$ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
